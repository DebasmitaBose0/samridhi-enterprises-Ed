version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: samridhi_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: samridhi_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/samridhi-enterprises
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: samridhi_client
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
